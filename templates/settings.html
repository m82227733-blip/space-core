{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="glass-card p-5 shadow-lg text-white" style="background: rgba(255,255,255,0.05); border-radius: 20px;">
        <h2 class="text-center mb-4" style="color: #00d2ff;">Profil Sozlamalari</h2>
        <div class="row">
            <div class="col-md-4 text-center">
                <div style="width: 120px; height: 120px; background: #00d2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto;">
                    {{ user.username|slice:":1"|upper }}
                </div>
                <h4 class="mt-3">{{ user.username }}</h4>
                <p class="text-secondary">Tizim administratori</p>
            </div>
            <div class="col-md-8">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Foydalanuvchi nomi</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" value="{{ user.username }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email manzili</label>
                        <input type="email" class="form-control bg-dark text-white border-secondary" value="{{ user.email }}" placeholder="Kiritilmagan">
                    </div>
                    <button type="button" class="btn btn-info w-100 mt-3">Ma'lumotlarni yangilash</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
