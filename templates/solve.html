{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-lg border-0" style="border-radius: 20px; overflow: hidden;">
            <div class="card-header bg-primary text-white p-4">
                <h4 class="mb-0 fw-bold">{{ assignment.title }}</h4>
            </div>
            <div class="card-body p-4 bg-white text-dark">
                <p class="fs-5">{{ assignment.content }}</p>
                
                {% if assignment.image %}
                    <img src="{{ assignment.image.url }}" class="img-fluid rounded mb-4 shadow-sm">
                {% endif %}

                <hr>

                <!-- XABARLAR CHIQADIGAN JOY -->
                {% if message %}
                    <div class="alert alert-{{ status }} d-flex align-items-center" role="alert" style="border-radius: 12px;">
                        {% if status == 'success' %}
                            <i class="fas fa-check-circle me-2"></i>
                        {% else %}
                            <i class="fas fa-exclamation-triangle me-2"></i>
                        {% endif %}
                        <div>{{ message }}</div>
                    </div>
                {% endif %}

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Sizning javobingiz:</label>
                        <input type="text" name="user_answer" class="form-control form-control-lg" placeholder="Javobni kiriting..." required style="border-radius: 12px;">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg flex-grow-1" style="border-radius: 12px;">
                            <i class="fas fa-paper-plane me-2"></i>Tekshirish
                        </button>
                        <a href="{% url 'student_dashboard' %}" class="btn btn-outline-secondary btn-lg" style="border-radius: 12px;">Orqaga</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
