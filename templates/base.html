<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathSphere | Matematika Markazi</title>
    
    <!-- Bootstrap va FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Matematik formulalar uchun MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        /* Uzum Market Gradient */
        .navbar { background: linear-gradient(90deg, #7000ff 0%, #a044ff 100%); }
        .btn-primary { background-color: #7000ff; border: none; }
        .btn-primary:hover { background-color: #5a00cc; }
        .card { border: none; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            <i class="fas fa-square-root-variable me-2"></i>MATH SPHERE
        </a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <a href="{% url 'student_dashboard' %}" class="text-white me-3 text-decoration-none">Dashboard</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Chiqish</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-light btn-sm">Kirish</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
